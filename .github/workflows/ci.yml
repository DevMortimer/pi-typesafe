name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell commands
        run: |
          shellcheck --version
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["22.19.0", "24", "26"]
        include:
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check

  package:
    name: Package
    needs: [workflow-lint, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check package metadata
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, 'pi-typesafe');
          assert.equal(lock.version, pkg.version, 'Lockfile version must match package.json');
          assert.equal(lock.packages[''].version, pkg.version, 'Lockfile root version must match package.json');
          NODE
      - name: Validate release tag and extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable versions can be released');
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match package.json');
          const changelog = readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
          const notes = changelog.split(`\n## ${version}\n`)[1]?.split('\n## ')[0]?.replace(/<!--[\s\S]*?-->/g, '').trim();
          assert.ok(notes, 'CHANGELOG.md must contain release notes, not just comments');
          writeFileSync(`${process.env.RUNNER_TEMP}/package/release-notes.md`, `${notes}\n`);
          NODE
      - run: npm ci
      - name: Build and smoke-test the npm tarball without optional Pi peers
        run: |
          npm pack --pack-destination "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package-smoke"
          printf '%s\n' '{"private":true,"type":"module"}' > "$RUNNER_TEMP/package-smoke/package.json"
          # Resolve dependencies as a consumer, without the checkout's lockfile or node_modules.
          npm install --prefix "$RUNNER_TEMP/package-smoke" --ignore-scripts --omit=peer --no-audit --no-fund "$RUNNER_TEMP/package"/pi-typesafe-*.tgz
          cd "$RUNNER_TEMP/package-smoke"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, statSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { createTypeSafe, noul } from 'pi-typesafe';
          import { auc } from 'pi-typesafe/calibrate';
          assert.equal(typeof createTypeSafe, 'function');
          assert.equal(noul('Is this a package smoke test?').type, 'noul');
          assert.equal(auc([{ label: false, score: 0 }, { label: true, score: 1 }]), 1);
          const metadataPath = fileURLToPath(import.meta.resolve('pi-typesafe/package.json'));
          const metadata = JSON.parse(readFileSync(metadataPath, 'utf8'));
          assert.equal(metadata.name, 'pi-typesafe');
          for (const peer of Object.keys(metadata.peerDependencies)) {
            assert.throws(() => import.meta.resolve(peer), { code: 'ERR_MODULE_NOT_FOUND' });
          }
          const targets = Object.values(metadata.exports).flatMap(value => typeof value === 'string' ? [value] : Object.values(value));
          for (const target of [...targets, ...metadata.pi.extensions, 'README.md', 'LICENSE']) {
            assert.ok(statSync(resolve(dirname(metadataPath), target)).isFile(), `Missing package entry: ${target}`);
          }
          NODE
      - name: Smoke-test the Pi entry points with locked peers
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const dependencies = Object.fromEntries(Object.keys(pkg.peerDependencies).map(name => [name, lock.packages[`node_modules/${name}`].version]));
          dependencies[pkg.name] = `file:${resolve(process.env.RUNNER_TEMP, 'package', `${pkg.name}-${pkg.version}.tgz`)}`;
          writeFileSync(`${process.env.RUNNER_TEMP}/package-smoke/package.json`, JSON.stringify({ private: true, type: 'module', dependencies }));
          NODE
          # Add the locked Pi peers to the same isolated consumer installation.
          npm install --prefix "$RUNNER_TEMP/package-smoke" --ignore-scripts --no-audit --no-fund
          cd "$RUNNER_TEMP/package-smoke"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import extension from 'pi-typesafe/extension';
          import { promptForApiKey, loginWithPrompt, ensureApiKey } from 'pi-typesafe/ui';
          assert.equal(typeof extension, 'function');
          for (const helper of [promptForApiKey, loginWithPrompt, ensureApiKey]) assert.equal(typeof helper, 'function');
          const metadataUrl = import.meta.resolve('pi-typesafe/package.json');
          const metadata = JSON.parse(readFileSync(new URL(metadataUrl), 'utf8'));
          for (const target of metadata.pi.extensions) {
            assert.equal((await import(new URL(target, metadataUrl).href)).default, extension);
          }
          NODE
      - name: Checksum the verified tarball
        run: |
          cd "$RUNNER_TEMP/package"
          sha256sum pi-typesafe-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 14

  ci:
    name: CI passed
    if: ${{ always() }}
    needs: [workflow-lint, check, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          CHECK: ${{ needs.check.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$WORKFLOW_LINT" = success
          test "$CHECK" = success
          test "$PACKAGE" = success

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [package, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/
      - name: Create a draft with the verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/package"
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" pi-typesafe-*.tgz SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
